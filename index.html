<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교육 만족도 즉석 집계</title>
<style>
  :root { --bg:#f5f6f8; --card:#fff; --text:#1f2933; --muted:#6b7280; --line:#e5e7eb;
          --c0:#2563eb; --c1:#10b981; --c2:#f59e0b; --warn-bg:#fff7e6; --warn:#b45309; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font-family:system-ui,-apple-system,"Segoe UI","Malgun Gothic",sans-serif; }
  main { max-width:880px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; font-size:.95rem; }
  .summary { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:12px; margin-bottom:12px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:14px 16px; }
  .stat b { display:block; font-size:1.4rem; margin-top:4px; }
  .stat span { color:var(--muted); font-size:.85rem; }
  .notice { background:var(--warn-bg); color:var(--warn); border:1px solid #fcd9a8; border-radius:10px;
            padding:10px 14px; margin-bottom:12px; font-size:.92rem; }
  .actions { display:flex; gap:8px; justify-content:flex-end; margin-bottom:16px; flex-wrap:wrap; }
  button { font:inherit; cursor:pointer; border-radius:8px; border:1px solid var(--line); background:#fff; padding:6px 12px; }
  button:hover { background:#f0f2f5; }
  .primary { background:var(--c0); border-color:var(--c0); color:#fff; }
  .primary:hover { background:#1d4ed8; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .q-head { display:flex; gap:8px; align-items:center; margin-bottom:6px; }
  .q-head label { font-weight:700; white-space:nowrap; }
  .q-head input { flex:1; min-width:0; font:inherit; padding:8px 10px; border:1px solid var(--line); border-radius:8px; }
  .q-meta { color:var(--muted); font-size:.85rem; margin:0 0 10px; }
  .row { display:grid; grid-template-columns:96px 1fr auto; gap:10px; align-items:center; margin:8px 0; }
  .opt { font-weight:600; font-size:.95rem; }
  .bar { position:relative; height:26px; background:#eef0f3; border-radius:6px; overflow:hidden; }
  .fill { height:100%; width:0; transition:width .25s ease; }
  .bar-txt { position:absolute; inset:0; display:flex; align-items:center; padding-left:8px; font-size:.85rem; font-weight:600; }
  .btns { display:flex; gap:4px; }
  .btns button { min-width:52px; }
  .minus { min-width:36px !important; color:var(--muted); }
  @media (max-width:520px) {
    .row { grid-template-columns:1fr auto; }
    .bar { grid-column:1 / -1; grid-row:2; }
  }
</style>
</head>
<body>
<main>
  <h1>교육 만족도 즉석 집계</h1>
  <p class="sub">문항은 입력칸에서 바로 수정할 수 있습니다. 선택지 버튼을 누르면 응답 1건이 추가되고, [−]로 취소합니다.</p>

  <section class="summary">
    <div class="stat"><span>총 응답 수(전체 입력 건)</span><b id="total">0건</b></div>
    <div class="stat"><span>응답자 수(문항별 최대)</span><b id="people">0명</b></div>
    <div class="stat"><span>가장 많이 선택된 항목(전체)</span><b id="top">-</b></div>
  </section>
  <div class="notice" id="notice">표본이 작아 참고용입니다. (응답 10건 미만)</div>
  <div class="actions">
    <button id="reset" type="button">전체 초기화</button>
    <button id="csv" class="primary" type="button">CSV 내려받기</button>
  </div>

  <section id="questions"></section>
</main>

<script>
  const OPTIONS = ["매우 유익", "유익", "개선 필요"];
  const COLORS = ["var(--c0)", "var(--c1)", "var(--c2)"];
  const MIN_SAMPLE = 10;
  const state = [
    { text: "교육 내용이 업무에 도움이 되었습니까?", counts: [0, 0, 0] },
    { text: "강사의 설명이 이해하기 쉬웠습니까?", counts: [0, 0, 0] },
    { text: "교육 시간과 진행 방식이 적절했습니까?", counts: [0, 0, 0] }
  ];

  const sum = a => a.reduce((s, v) => s + v, 0);
  const pct = (n, d) => d ? Math.round(n / d * 1000) / 10 : 0;
  function topLabel(counts) {
    const max = Math.max(...counts);
    if (max === 0) return "-";
    return OPTIONS.filter((_, i) => counts[i] === max).join(" · ");
  }

  const wrap = document.getElementById("questions");
  state.forEach((q, qi) => {
    const card = document.createElement("article");
    card.className = "q";
    card.innerHTML =
      `<div class="q-head"><label for="q${qi}">Q${qi + 1}</label>` +
      `<input id="q${qi}" type="text" maxlength="120"></div>` +
      `<p class="q-meta" id="meta${qi}"></p>` +
      OPTIONS.map((opt, oi) =>
        `<div class="row"><span class="opt">${opt}</span>` +
        `<div class="bar"><div class="fill" id="f${qi}-${oi}" style="background:${COLORS[oi]};opacity:.35"></div>` +
        `<span class="bar-txt" id="t${qi}-${oi}"></span></div>` +
        `<div class="btns"><button type="button" data-q="${qi}" data-o="${oi}" data-d="1">+1</button>` +
        `<button type="button" class="minus" data-q="${qi}" data-o="${oi}" data-d="-1" aria-label="${opt} 취소">−</button></div></div>`
      ).join("");
    wrap.appendChild(card);
    const input = card.querySelector("input");
    input.value = q.text;
    input.addEventListener("input", e => { q.text = e.target.value; });
  });

  wrap.addEventListener("click", e => {
    const b = e.target.closest("button[data-q]");
    if (!b) return;
    const c = state[+b.dataset.q].counts, o = +b.dataset.o;
    c[o] = Math.max(0, c[o] + Number(b.dataset.d));
    render();
  });

  function render() {
    const all = [0, 0, 0];
    let people = 0;
    state.forEach((q, qi) => {
      const n = sum(q.counts);
      people = Math.max(people, n);
      q.counts.forEach((v, oi) => {
        all[oi] += v;
        const p = pct(v, n);
        document.getElementById(`f${qi}-${oi}`).style.width = p + "%";
        document.getElementById(`t${qi}-${oi}`).textContent = `${v}명 · ${p}% (${v}/${n})`;
      });
      document.getElementById(`meta${qi}`).textContent =
        `응답 ${n}건 · 최다 선택: ${topLabel(q.counts)}` + (n > 0 && n < MIN_SAMPLE ? " · 표본이 작아 참고용" : "");
    });
    const total = sum(all);
    document.getElementById("total").textContent = total + "건";
    document.getElementById("people").textContent = people + "명";
    document.getElementById("top").textContent = topLabel(all);
    document.getElementById("notice").style.display = total < MIN_SAMPLE ? "block" : "none";
  }

  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("모든 응답을 0으로 초기화할까요?")) return;
    state.forEach(q => q.counts = [0, 0, 0]);
    render();
  });

  document.getElementById("csv").addEventListener("click", () => {
    const esc = v => `"${String(v).replace(/"/g, '""')}"`;
    const rows = [["문항번호", "문항", "선택지", "응답 수", "문항 응답 수(분모)", "비율(%)"]];
    state.forEach((q, qi) => {
      const n = sum(q.counts);
      q.counts.forEach((v, oi) => rows.push([`Q${qi + 1}`, q.text, OPTIONS[oi], v, n, pct(v, n)]));
    });
    const csv = "﻿" + rows.map(r => r.map(esc).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
    const a = document.createElement("a");
    const d = new Date(), z = x => String(x).padStart(2, "0");
    a.href = url;
    a.download = `교육만족도_${d.getFullYear()}${z(d.getMonth() + 1)}${z(d.getDate())}_${z(d.getHours())}${z(d.getMinutes())}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  });

  render();
</script>
</body>
</html>
