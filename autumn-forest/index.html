<title>단풍과 은행나무 숲</title>
<meta name="description" content="단풍나무와 은행나무가 가득한 가을 숲길을 잉크 선으로 그린 움직이는 그림.">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#ebe8e2;color-scheme:light}
  body{display:grid;place-items:center;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
  .card{position:relative;width:min(100%,calc((100vh - 48px) * 2));aspect-ratio:2/1;max-width:100%;border-radius:18px;overflow:hidden;background:#fdfcf8;
        box-shadow:0 1px 0 rgba(255,255,255,.7) inset,0 0 0 1px rgba(40,34,26,.10),0 18px 50px -18px rgba(40,34,26,.35),0 4px 14px -6px rgba(40,34,26,.18);
        --ink:#1c1c1c;touch-action:none;isolation:isolate}
  #forest,#forest svg{display:block;width:100%;height:100%;user-select:none;-webkit-user-select:none}
  #forest svg .pp{fill:var(--paper,#fdfdfc)}
  #forest svg.scrubbing,#forest svg.scrubbing *{cursor:grabbing!important}
  .hud{position:absolute;right:2.4%;top:3.4%;text-align:right;font:500 clamp(10px,1.25vw,15px)/1.3 "Gowun Batang","Nanum Myeongjo","AppleMyungjo",Georgia,serif;color:var(--ink);letter-spacing:.04em;pointer-events:none;opacity:.85}
  .hud b{font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.06em}
  .hud span{margin-left:7px;font-size:.92em}
  #hint{position:absolute;left:0;right:0;bottom:2.6%;margin:0;text-align:center;font:clamp(9px,1.1vw,13px)/1.4 "Gowun Batang","Nanum Myeongjo",Georgia,serif;color:var(--ink);opacity:.78;pointer-events:none;transition:opacity 1.2s;text-shadow:0 0 6px var(--glow,#fdfcf8),0 0 3px var(--glow,#fdfcf8)}
  #hint.gone{opacity:0}
  .capture #hint{display:none}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
<div class="card" id="card">
  <div id="forest"></div>
  <div class="hud" id="clock"></div>
  <p id="hint">해를 끌어 시간을 바꾸고 · 나무, 사람, 다람쥐, 까치, 물을 눌러 보세요 · 마우스를 휘저으면 바람이 붑니다</p>
</div>
<!--SCRIPT-->
